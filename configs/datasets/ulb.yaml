# ULB / Worldline credit-card fraud (Kaggle: mlg-ulb/creditcardfraud). See DATA_LICENSES.md.
dataset:
  name: ulb-creditcard
  path: data/external/ulb/creditcard.csv
  label_column: Class            # 1 = fraud, 0 = legitimate
