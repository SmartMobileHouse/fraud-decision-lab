# Bundled synthetic card transactions (fictional; MIT). Regenerate with: fraudlab data generate-demo
dataset:
  name: synthetic-v1
  path: data/demo/synthetic.parquet
  label_column: is_fraud
  id_column: tx_id
  time_column: event_time
  features:            # explicit list: the hidden `scenario` column is never a model input
    - amount
    - currency
    - merchant_category
    - hour_of_day
    - tx_count_1h
    - tx_count_24h
    - avg_amount_30d
    - amount_to_avg_ratio
    - device_known
    - country_mismatch
    - card_age_days
    - failed_attempts_24h
  feature_descriptions:
    amount: "Transaction amount"
    currency: "Transaction currency"
    merchant_category: "Type of merchant"
    hour_of_day: "Local hour of the transaction (0-23)"
    tx_count_1h: "Transactions on this card in the last hour, including this one"
    tx_count_24h: "Transactions on this card in the last 24 hours, including this one"
    avg_amount_30d: "Card's average transaction amount over the last 30 days (null for new cards)"
    amount_to_avg_ratio: "amount divided by avg_amount_30d"
    device_known: "Device was seen on this card before (null = unknown)"
    country_mismatch: "Transaction country differs from the card's home country (null = unknown)"
    card_age_days: "Days since the card was issued"
    failed_attempts_24h: "Failed payment attempts on this card in the last 24 hours"
  external_processing_allowed: true
  publication_allowed: true
  publication_note: "Original fictional data generated by this project and licensed under MIT."
  license_note: "Original synthetic data generated by this project (MIT). Fraud labels are simulated."
split: {train: 0.70, validation: 0.15, holdout: 0.15, seed: 42}
holdout_sample: null   # 66,667 rows -> holdout is exactly 10,000
